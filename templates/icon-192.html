<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ícone PharmaAI</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 192px;
            height: 192px;
            background: linear-gradient(135deg, #0f2b4b, #1a5276, #2e86c1);
            font-family: 'Segoe UI', sans-serif;
            border-radius: 20px;
        }
        .icon {
            text-align: center;
            color: white;
        }
        .icon .emoji {
            font-size: 80px;
            display: block;
        }
        .icon .text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>
    <div class="icon">
        <span class="emoji">🏥</span>
        <span class="text">PharmaAI</span>
    </div>
</body>
</html>
